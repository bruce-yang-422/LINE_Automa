<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>登入 · LINE 自動化</title><script src="/appearance.js"></script><link id="theme-favicon" rel="icon" href="/assets/brand/line-automation-logo-light.ico"><link rel="stylesheet" href="/app.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-layout"><section class="login-intro"><a class="brand" href="/login"><img class="brand-logo" src="/assets/brand/line-automation-logo-light.png" alt="" width="44" height="44"><span>LINE 自動化<small>你的通知與報告工作台</small></span></a><h1>讓每一次通知，<br>都有清楚的下一步。</h1><p>集中管理報告、收件者與發送排程。登入後，繼續處理你獲授權的工作。</p><div class="login-features"><span>報告與訊息</span><span>組織與權限</span><span>預約與發送</span></div></section><section class="panel login-card" aria-labelledby="login-title"><div class="login-theme"><div class="appearance-picker" role="group" aria-label="介面色系"><button type="button" data-appearance="system" title="跟隨系統" aria-label="跟隨系統" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button><button type="button" data-appearance="light" title="淺色" aria-label="淺色" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button type="button" data-appearance="dark" title="深色" aria-label="深色" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg></button></div></div><h2 id="login-title">歡迎回來</h2><p class="subtitle" id="login-description">使用你的工作台帳號登入。</p><p class="callout" id="login-migration" hidden>目前仍有 Cloudflare Access 入口驗證。站內密碼設定完成後，再由管理員完成入口切換。</p><p class="notice" id="login-notice" role="alert" hidden></p>
<form id="login-form"><label class="field" id="login-email-field">電子郵件<input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required placeholder="name@example.com"></label><label class="field">密碼<div class="password-input"><input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" id="password-visibility" class="quiet" aria-label="顯示密碼" aria-pressed="false">顯示</button></div></label><label class="field" id="login-confirm-field" hidden>再次輸入密碼<input id="login-confirm" type="password" autocomplete="new-password" maxlength="128"></label><label class="check-label" id="login-remember-field"><input id="login-remember" type="checkbox">保持登入 30 天（私人裝置適用）</label><button id="login-submit" type="submit" class="btn primary">登入</button></form>
<details id="login-help"><summary>首次登入或忘記密碼？</summary><p>請聯絡平台管理員，在「帳號與設定」產生一次性設定連結。連結有效 30 分鐘；一般 LINE 收件者不需後台帳號。</p></details><a id="login-back" href="/login" hidden>返回登入</a></section></main><footer class="login-footer">LINE 自動化工作台 · 僅開放已授權帳號</footer></body></html>
