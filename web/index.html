<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINE 自動化 - 收件者管理</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/management.css">
</head>
<body class="apple-layout">
    <div id="root"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        
        createApp({
            components: {
                ContactsManager: require("./components/crm/contacts-manager.vue").default
            },
            data() {
                return {
                    currentView: "contacts",
                    sidebarOpen: false
                };
            },
            mounted() {
                const params = new URLSearchParams(window.location.search);
                const view = params.get("view") || this.currentView;
                if (this.$data.currentView !== view) {
                    this.$data.currentView = view;
                    console.log(`載入視圖：${view}`);
                }
            },
            template: `
                <div class="root-container">
                    <aside v-show="sidebarOpen" class="sidebar">
                        <div class="sidebar-header">
                            <h2>收件者管理</h2>
                            <button @click="sidebarOpen = false" class="close-btn">&times;</button>
                        </div>
                        <nav class="sidebar-nav">
                            <a href="/" :class="{ active: currentView === 'contacts' }" @click.prevent="currentView='contacts'">
                                📇 收件者管理
                            </a>
                        </nav>
                    </aside>
                    <main :style="sidebarOpen ? { marginLeft: '320px' } : {}" class="main-content">
                        <div v-if="currentView === 'contacts'" class="content-wrapper">
                            <contacts-manager></contacts-manager>
                        </div>
                        <div v-else class="empty-view">
                            <h1>功能開發中</h1>
                            <p>正在構建{{ currentView.replace(/([A-Z])/g, '- ').toLowerCase() }}功能</p>
                        </div>
                    </main>
                </div>
            `
        }).mount("#root");
    </script>
</body>
</html>
