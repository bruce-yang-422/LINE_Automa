<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VuE 整合測試 - Contacts Manager</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/management.css">
</head>
<body class="apple-layout">
    <div id="root"></div>

    <script type="module">
        import { createApp, h } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        
        const app = createApp({
            data() {
                return {
                    currentView: 'contacts',
                    sidebarOpen: false
                };
            },
            mounted() {
                const params = new URLSearchParams(window.location.search);
                const view = params.get('view') || this.currentView;
                if (this.$data.currentView !== view) {
                    this.$data.currentView = view;
                    console.log(`載入視圖：${view}`);
                }
            },
            render() {
                return h('div', { class: 'root-container' }, [
                    h('aside', { 
                        class: ['sidebar', this.sidebarOpen ? '' : 'hidden'] 
                    }, [
                        h('div', { class: 'sidebar-header' }, [
                            h('h2', {}, '收件者管理'),
                            h('button', { 
                                class: 'close-btn',
                                onClick: () => this.sidebarOpen = false
                            }, '\u00d7')
                        ]),
                        h('nav', { class: 'sidebar-nav' }, [
                            h('a', {
                                href: '/',
                                class: { active: this.currentView === 'contacts' },
                                onClick: (e) => { e.preventDefault(); this.currentView='contacts'; }
                            }, '\ud83d\udcfd\u200d\ud83d\uddc4\ufe0f \u7b49件者管\u7406')
                        ])
                    ]),
                    h('main', { 
                        style: this.sidebarOpen ? { marginLeft: '320px' } : {}
                        class: 'main-content'
                    }, [
                        h('div', { 
                            vIf: this.currentView === 'contacts',
                            class: 'content-wrapper'
                        }, [
                            // 這裡只是簡單的佔位內容，Vue 組件會在獨立頁面測試
                            h('h1', {}, '\u6536\u4ef6\u8005\u7ba1\u7406\u92fc達\u98a8\u683c'),
                            h('p', {}, 'Vue \u7d44\u4ef6\u6eaf\u7dfb\u4f86\u81ea web/components/crm/contacts-manager.vue')
                        ]),
                        h('div', { 
                            vElse,
                            class: 'empty-view'
                        }, [
                            h('h1', {}, '\u529f\u80fd\u767c\u898b\u4e2d'),
                            h('p', {}, '\u6b63\u5728\u69cb\u5efa'+this.currentView.replace(/([A-Z])/g, '- ').toLowerCase()+'\u529f\u80fd')
                        ])
                    ])
                ]);
            }
        });

        app.mount('#root');
    </script>
</body>
</html>
