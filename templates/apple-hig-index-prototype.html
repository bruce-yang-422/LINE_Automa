<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Apple HIG 視覺改版原型｜LINE 自動化</title>
    <link rel="stylesheet" href="styles/app.css">
</head>
<body class="apple-layout">
    <!-- Apple HIG 風格側欄 -->
    <aside class="apple-sidebar" id="sidebar" role="navigation" aria-label="主要導覽">
        <header class="sidebar-header">
            <button class="icon-button sidebar-toggle" id="sidebar-toggle" 
                    aria-label="切換導覽" aria-expanded="true">
                <span data-icon="chevron-left"></span>
            </button>
            <a class="brand-link" href="?view=overview" aria-label="回到首頁">
                <img src="/assets/brand/line-automation-logo-light.png" 
                     alt="LINE 自動化" width="40" height="40">
                <div class="brand-text">
                    <span class="brand-name">LINE 自動化</span>
                    <small class="brand-subtitle">Apple 風格介面</small>
                </div>
            </a>
        </header>

        <!-- 工作區導覽 -->
        <section class="nav-section" aria-labelledby="workspace-heading">
            <p class="nav-label section-label" id="workspace-heading">工作空間</p>
            <nav aria-label="工作空間導覽" role="tablist">
                <button class="nav-item active" data-view="overview" type="button">
                    <span class="nav-icon" data-icon="grid"></span>
                    <span class="nav-title">工作總覽</span>
                    <span class="nav-shortcut">⌘1</span>
                </button>
                <button class="nav-item" data-view="reports" type="button">
                    <span class="nav-icon" data-icon="file"></span>
                    <span class="nav-title">報告中心</span>
                    <span class="nav-count nav-badge">—</span>
                </button>
                <button class="nav-item" data-view="send" type="button">
                    <span class="nav-icon" data-icon="send"></span>
                    <span class="nav-title">建立發送</span>
                </button>
                <button class="nav-item" data-view="schedule" type="button">
                    <span class="nav-icon" data-icon="clock"></span>
                    <span class="nav-title">排程管理</span>
                </button>
                <button class="nav-item" data-view="contacts" type="button">
                    <span class="nav-icon" data-icon="users"></span>
                    <span class="nav-title">收件者管理</span>
                </button>
            </nav>
        </section>

        <!-- Apple HIG 風格頁尾 -->
        <footer class="sidebar-footer">
            <div class="app-note">
                <span class="status-dot status-online"></span>
                <div class="note-content">
                    <strong>讓每天的通知，更有條理</strong>
                    <small>報告・團隊・自動化</small>
                </div>
            </div>
        </footer>
    </aside>

    <!-- 主要內容區域 -->
    <main class="apple-main-content" id="main-content">
        <header class="apple-topbar">
            <div class="topbar-left">
                <button class="icon-button mobile-toggle" id="mobile-menu">☰</button>
                <a class="topbar-brand-link" href="?view=overview"><img src="/assets/brand/line-automation-logo-light.png" alt=""></a>
            </div>
            <div class="topbar-actions">
                <button class="command-trigger" id="command-open">⌘ K</button>
                <div class="connection-status" id="connection">
                    <span class="status-dot status-online"></span>
                    <span class="connection-label">連線中</span>
                </div>
            </div>
        </header>

        <div class="content-area" id="content">
            <div id="notice" class="notice" role="status" aria-live="polite"></div>
            <div class="loading-state apple-loading">
                <h1>Apple HIG 視覺改版原型</h1>
                <p>側欄・工具列・內容區完整實現</p>
                <small class="loading-subtitle">符合 Apple Human Interface Guidelines</small>
            </div>
        </div>
    </main>

    <!-- 搜尋工作台視窗 -->
    <dialog id="command-dialog" class="command-dialog">
        <div class="command-container">
            <div class="command-header">
                <span data-icon="search"></span>
                <input id="command-search" type="search" placeholder="搜尋頁面、報告或收件者…" autocomplete="off">
                <button class="icon-button command-close-btn" aria-label="關閉搜尋" id="command-close">✕</button>
            </div>
            <div id="command-results" class="command-results"></div>
            <p class="command-hint" id="command-count" role="status"></p>
        </div>
    </dialog>
</body>
</html>
